name: build

on:
  push:
    branches: [main]
    tags: ["v*"]          # git tag v1.0.0 && git push origin v1.0.0 -> GitHub Release
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Setup
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Test, build, selftest, installer
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShinobiCam-win64
          path: |
            dist/ShinobiCam-win64.zip
            dist/ShinobiCam-*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest   # Apple Silicon: mediapipe has no macOS Intel wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup
        run: ./scripts/setup.sh
      - name: Test, build, selftest
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ShinobiCam-macos-arm64
          path: dist/ShinobiCam-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag e versione coincidono
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' shinobicam/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ma __version__ = $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ShinobiCam $GITHUB_REF_NAME" --generate-notes
